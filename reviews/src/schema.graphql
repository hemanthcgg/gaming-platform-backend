extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@key", "@external"]
  )

extend type Game @key(fields: "id") {
  id: ID! @external
  reviews: [Review!]!
}

extend type User @key(fields: "id") {
  id: ID! @external
}

type Review {
  id: ID!
  rating: Int!
  comment: String!
  userId: ID!
  gameId: ID!
  user: User!
}

type Query {
  reviews: [Review!]!
  review(id: ID!): Review
}